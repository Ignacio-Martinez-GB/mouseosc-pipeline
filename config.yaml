# =============================================================================
# config.yaml  —  ÚNICO punto de control del pipeline
# =============================================================================
# Regla de oro: NINGÚN número del análisis vive en el código. Todo lo que un
# usuario podría querer cambiar está aquí, y cada parámetro lleva:
#   • QUÉ es,
#   • QUÉ pasa si lo subes / bajas (↑ / ↓),
#   • un valor TÍPICO para LFP/ERG de ratón.
#
# -----------------------------------------------------------------------------
# ¿ERES NUEVO? Los valores de este archivo YA son una configuración correcta y
# completa. Para analizar TUS datos normalmente solo necesitas cambiar 3 cosas:
#     1. dataset.root            → la carpeta donde están tus datos
#     2. dataset.mat.channel     → el nombre de la variable con la señal (.mat)
#     3. preprocessing.fs        → tu frecuencia de muestreo
# Todo lo demás puede quedarse como está y el análisis será válido.
#
# ¿ERES USUARIO AVANZADO? Cada bloque tiene un `enabled:` para activar/desactivar
# ese análisis, y los parámetros del método justo debajo. Los bloques opcionales
# son: spectral.specparam, pac, bursts, noise, statistics.factorial y cada
# entrada de `comparisons`. Al correr, el pipeline imprime un PLAN indicando qué
# se hará y qué se omitió.
#
# ORDEN DE LECTURA RECOMENDADO:
#   analysis_band → dataset → preprocessing → spectral/bands → noise
#   → pac/bursts → statistics → descriptivo/comparisons → plotting → output
# =============================================================================

project:
  name: "analisis_raton"        # etiqueta que aparece en salidas y reportes
  seed: 1234                    # semilla aleatoria fija → resultados reproducibles
                                # ↑ cambiarla afecta SOLO procesos aleatorios (p. ej.
                                #   los subrogados de PAC). Welch y la potencia por
                                #   banda son deterministas y no cambian.

# -----------------------------------------------------------------------------
# RANGO GLOBAL DE ANÁLISIS — recorta TODO el proyecto a esta ventana de frecuencia.
# -----------------------------------------------------------------------------
# Se aplica a PSD, bandas, specparam, potencia relativa, PAC y detección de ruido.
# Las bandas se acotan SOLO en los extremos: las interiores no cambian, una que
# cruza el límite se recorta, y una totalmente fuera (p. ej. mua 300–500) se
# elimina. Pon null para no limitar.
# Recomendado a partir del análisis de separabilidad señal/ruido: [0.4, 160].
analysis_band: [0.4, 160.0]

# -----------------------------------------------------------------------------
# DATASET — de dónde salen los datos y cómo se leen.
# -----------------------------------------------------------------------------
# El pipeline NO adivina la estructura de tus carpetas. En vez de eso lee un
# "manifiesto" (CSV) que lista cada registro y sus metadatos. Esto lo hace
# genérico: sirve para cualquier organización de archivos y cualquier diseño
# experimental. Genera una plantilla con:  python run.py scan-folder Datos/
dataset:
  manifest: "manifest.csv"      # CSV con: file_path, group, animal_id, [extra...]
  root: "Datos"                 # carpeta raíz (las rutas del manifiesto son relativas a ésta)
  format: "mat"                 # auto | mat | csv | abf | nwb
                                # ↑ "auto" decide por la extensión del archivo.
                                #   Fíjalo si tus archivos tienen extensión rara.

  # ---------------------------------------------------------------------------
  # ESCANEO AUTOMÁTICO DEL ÁRBOL (modo "scan" / scan-folder)
  # ---------------------------------------------------------------------------
  # El escáner clasifica cada archivo por las PALABRAS de su ruta, sin importar
  # en qué NIVEL o en qué ORDEN estén las carpetas (así sirve para árboles con
  # profundidades y órdenes distintos). Cada factor lista sus sinónimos: si una
  # palabra aparece en la ruta, se asigna ese valor canónico.
  # Edita este diccionario según cómo nombres TUS carpetas.
  scan:
    group_from: dieta           # qué factor alimenta la columna 'group' (comparación por defecto)

    # animal_id: por defecto es el NOMBRE DEL ARCHIVO, así que cada registro
    # cuenta como una observación independiente.
    # ⚠ PSEUDORREPLICACIÓN: si un mismo animal aporta varios registros (ojo
    #   izquierdo/derecho, o las condiciones foto y meso), esas medidas NO son
    #   independientes. Tratarlas como si lo fueran infla la significancia
    #   (aunque es una práctica común en la literatura).
    #   Para agrupar por animal real, activa un regex que extraiga el sujeto del
    #   nombre del archivo. Ejemplo para nombres tipo IC57S0C1H1ODEspontaneo...:
    # animal_id_regex: "(S\\d+C\\d+[HM]\\d+)"     # → S0C1H1 (mismo animal, ambos ojos)
    #   Con animal_id real puedes además promediar por animal antes de la
    #   estadística, o usar comparaciones pareadas (statistics.paired: true)
    #   cuando compares condiciones medidas en el MISMO animal (foto vs meso).
    factores:
      dieta:
        control: [CONTROL, Control, "DIETA CONTROL"]
        obeso:   [PUPS, OBESO, Obesos, obeso, "DIETA PUPS"]
      condicion:
        foto: [FOTO, Foto]
        meso: [MESO, Meso]
      sexo:
        hembra: [HEMBRAS, Hembras]
        macho:  [MACHOS, Machos]
      # --- Factores OPCIONALES (quedan vacíos donde no aplican) ---
      autor:                    # solo en datasets que separan por autor
        ale:   [ale]
        wendy: [wendy]
      cirugia:                  # solo en la rama post-cirugía
        sham:        [SHAM, SAHM]           # incluye el typo real
        transplante: [TRANSPLANTE, TRANSPLNTE]
      dia:
        d9:  ["9 DIAS"]
        d14: ["14 DIAS", "REGISTRO 14"]
        d28: ["28 DIAS"]

  # --- Opciones específicas por formato (solo se usa la del formato activo) ---
  mat:
    channel: "someData2"        # nombre de la variable dentro del .mat con la señal
    # ↑ si no sabes cuál es, corre  python run.py inspect <archivo.mat>
  csv:
    time_col: 0                 # índice (o nombre) de la columna de tiempo; null si no hay
    signal_col: 1               # índice (o nombre) de la columna de voltaje
    delimiter: ","
    skiprows: 0                 # filas de encabezado a saltar
  abf:
    channel: 0                  # índice de canal en el archivo Axon
  nwb:
    series: "ElectricalSeries"  # nombre del TimeSeries dentro del NWB

# -----------------------------------------------------------------------------
# PREPROCESAMIENTO — limpieza antes del análisis espectral.
# -----------------------------------------------------------------------------
preprocessing:
  fs: 2000                # Hz. Frecuencia de muestreo. DEBE coincidir con tus
                          # datos. El pipeline VERIFICA fs contra el nº de
                          # muestras y la duración; si no cuadra, se detiene.
  fs_tolerance: 0.02      # tolerancia relativa (2 %) al verificar fs vs datos.

  detrend: true           # quita pendiente + offset DC por mínimos cuadrados.
                          # ↑ casi siempre TRUE: el análisis oscilatorio mira la
                          #   componente AC, no el nivel continuo.
  highpass_hz: 0.5        # filtro paso-alto (Butterworth fase-cero, orden 4).
                          # ↑ subir (1.0) limpia más deriva lenta pero se come
                          #   oscilaciones <1 Hz.  ↓ bajar (0.1) conserva lo lento.
  lowpass_hz: 500.0       # paso-bajo. Debe ser ≤ Nyquist (= fs/2). Anti-aliasing
                          # de software; con fs=2000 el tope es 1000.

  epoch_length_s: 2.0     # longitud de cada época para PSD (s).
                          # ↑ épocas largas = mejor resolución en frecuencia
                          #   pero MENOS épocas para promediar (PSD más ruidoso).
  epoch_overlap: 0.5      # solape entre épocas (0–1). ↑ más épocas (correlacionadas).

  artifact_threshold_sd: 8   # rechazo de épocas: descarta las que superan
                             # N×SD de amplitud. ↓ 5 = estricto; ↑ 12 = permisivo.
                             # El reporte avisa si se rechaza >30 % de épocas.

  # NOTCH de línea eléctrica aplicado SIEMPRE (en los 3 análisis). Por defecto
  # 60 Hz + armónicos (México/EU-Norte). En Europa cambia hz a 50.
  notch_default:
    enabled: true
    hz: 60.0
    n_armonicos: 3           # 60, 120, 180 Hz
    Q: 30                    # factor de calidad (↑ = muesca más angosta)

# -----------------------------------------------------------------------------
# ESPECTRO — PSD de Welch y separación 1/f (specparam / FOOOF).
# -----------------------------------------------------------------------------
spectral:
  welch:
    overlap: 0.5          # solape interno de Welch (cuando época > ventana).
    freq_min: 0.5         # menor frecuencia a conservar (Hz).
    freq_max: 500.0       # mayor frecuencia (Hz). Tope físico = Nyquist = fs/2.

  # Análisis MULTI-VENTANA: corre el espectro una vez por cada ventana activa.
  # Resolución espectral Δf = 1 / window_s.
  #   2 s → 0.5 Hz (rápido, muchas épocas) | 4 s → 0.25 Hz | 10 s → 0.1 Hz (fino, ruidoso)
  windows:
    - {window_s: 2.0,  enabled: true}
    - {window_s: 4.0,  enabled: false}
    - {window_s: 10.0, enabled: false}
  primary_window_s: 2.0   # ventana usada por PAC (no espectral). Debe estar activa.

  specparam:
    enabled: true         # si false, se omite la separación 1/f (no requiere la
                          # dependencia opcional `specparam`).
    freq_range: [1.0, 300.0]      # rango donde se ajusta el modelo (Hz).
    peak_width_limits: [0.5, 8.0] # ancho mín/máx de un pico (Hz).
    max_n_peaks: 6                # máx. picos por PSD. ↑ más picos = sobreajuste.
    min_peak_height: 0.05         # altura mínima (log10) para contar un pico.
    aperiodic_mode: "fixed"       # "fixed" (offset+pendiente) | "knee" (añade codo).

# -----------------------------------------------------------------------------
# BANDAS de frecuencia. Edita libremente. Cubre 0.5–500 Hz sin huecos para que
# ninguna energía del PSD quede fuera de las métricas por banda.
# Las bandas "gap_" son rangos exploratorios sin nombre canónico en la literatura.
# -----------------------------------------------------------------------------
bands:
  slow:     [0.5,   2.0]
  low_osc:  [2.0,   5.0]
  mid_osc:  [5.0,  12.0]   # ⚠ en ratón in vivo solapa con el latido cardiaco (~5–12 Hz).
                           #   Interpreta los picos de esta banda con cautela.
  beta:     [12.0,  30.0]
  gamma_lo: [30.0,  60.0]
  gamma_hi: [60.0, 160.0]
  mua:      [300.0, 500.0] # actividad multiunitaria (no es una oscilación "de banda").

relative_power:
  reference_range: [0.5, 160.0]  # denominador de la potencia relativa.
  # ↑ la potencia relativa de cada banda = abs_power / integral(PSD en este rango).

# -----------------------------------------------------------------------------
# PAC — acoplamiento fase-amplitud (Tort MI + Canolty MVL).
# -----------------------------------------------------------------------------
pac:
  enabled: true
  n_phase_bins: 18        # bins de fase para el MI (18 = 20° cada uno).
  n_surrogates: 200       # nº de subrogados para la significancia del MI.
                          # ↑ más subrogados = p más preciso, pero más lento.
  pairs:                  # cada par: banda de FASE (lenta) × banda de AMPLITUD (rápida)
    - {name: "theta-gamma", phase: [5.0, 12.0], amp: [30.0, 60.0]}  # ⚠ fase solapa cardiaco
    - {name: "slow-gamma",  phase: [0.5, 2.0],  amp: [30.0, 60.0]}
  comodulogram:
    enabled: false        # mapa completo fase×amplitud (caro). Actívalo por caso.
    phase_range: [1.0, 14.0]
    phase_step: 1.0
    amp_range: [20.0, 120.0]
    amp_step: 10.0

# -----------------------------------------------------------------------------
# RUIDO ELÉCTRICO — esquema de 3 análisis para el ruido de 10 Hz + armónicos.
# -----------------------------------------------------------------------------
# (El ruido de 60 Hz se suprime aparte, siempre, en preprocessing.notch_default.)
# Cuando enabled=true, las salidas se organizan en carpetas analisis_1/2/3.
noise:
  enabled: true            # actívalo para el esquema de detección/corrección de 10 Hz
  analyses: [1, 2, 3]       # cuáles correr: [1]=normal, [2]=sin ruido, [3]=corregido.
                            #   Ej.: [1, 3] corre solo normal y corregido.
  metodo_correccion: "interpolacion"   # método del Análisis 3 (corregido):
                            #   "interpolacion" = reemplaza los armónicos por el fondo
                            #        interpolado (elimina el pico; no usa archivos de ruido).
                            #   "escalada"      = escala la forma del ruido al exceso del
                            #        pico y lo resta hasta la base.
                            #   "literal"       = resta el promedio del ruido tal cual
                            #        (baja el pico solo parcialmente).
  fundamental_hz: 10.0      # frecuencia del ruido a tratar (y sus armónicos).
  n_armonicos: 6            # 10, 20, 30, 40, 50, 60 Hz (los < freq_max).
  freq_max: 200.0           # tope para buscar armónicos.
  ancho_hz: 0.5             # media-ventana alrededor de cada armónico (detección y resta).
  deteccion:
    snr_umbral: 3.0         # veces sobre el fondo local para contar un armónico como pico.
    min_armonicos: 2        # nº de armónicos por encima para marcar el archivo contaminado.
    persistencia_temporal: 0.5   # fracción del tiempo con la línea presente (ruido = estacionario).
  notch_Q: 30               # Q del notch de 10 Hz que se aplica a PAC/bursts en el análisis 3.
  ruido:
    dir: "Datos/Ruido"      # carpeta con archivos SOLO de ruido (se excluye del análisis).
    reference_csv: "ruido_referencia.csv"   # si existe, se usa; si no, se calcula del dir.

# -----------------------------------------------------------------------------
# BURSTS — detección de ráfagas oscilatorias (envolvente de Hilbert).
# -----------------------------------------------------------------------------
bursts:
  enabled: true          # actívalo para añadir métricas de ráfaga por registro.
  threshold_sd: 2.0       # umbral = media + N×SD de la envolvente.
                          # ↑ más estricto (menos ráfagas). ↓ más permisivo.
  min_duration_ms: 50.0   # duración mínima para contar una ráfaga.
  merge_gap_ms: 25.0      # fusiona ráfagas separadas por menos que este gap.
  detection_bands:        # bandas donde buscar ráfagas (edítalas libremente).
    gamma_lo: [30.0, 60.0]
    gamma_hi: [60.0, 160.0]

# -----------------------------------------------------------------------------
# ESTADÍSTICA de grupos.
# -----------------------------------------------------------------------------
statistics:
  group_col: "dieta"          # columna del manifiesto que define los grupos a comparar.
  paired: false               # ¿medidas repetidas (mismo animal)? true usa pruebas pareadas.
  alpha: 0.05                 # umbral de significancia de las comparaciones.
  correction: "holm"          # corrección múltiple: holm | bonferroni | fdr_bh | none.
  min_n_per_group: 3          # nº mínimo por grupo; debajo, se marca un aviso.

  # --- CÓMO SE ELIGE LA PRUEBA ------------------------------------------------
  # "auto"            comprueba los supuestos y decide:
  #                     Shapiro-Wilk (normalidad por grupo) + Levene (varianzas)
  #                       normal + varianzas iguales   → t de Student / ANOVA 1 vía
  #                       normal + varianzas desiguales→ t de Welch  / ANOVA de Welch
  #                       no normal                    → Mann-Whitney / Kruskal-Wallis
  # "parametrico"     fuerza t/ANOVA (Welch si las varianzas difieren).
  # "no_parametrico"  fuerza Mann-Whitney / Kruskal-Wallis (conservador; útil con n
  #                   pequeño, donde Shapiro tiene poca potencia).
  # En los 3 casos el CSV reporta la prueba usada y los p de Shapiro y Levene.
  metodo: "auto"
  alpha_supuestos: 0.05       # umbral de Shapiro/Levene. ↓ 0.01 = más permisivo con
                              # la normalidad (rechaza menos → usa más paramétricas).

  # --- QUÉ COMPARACIONES SE HACEN ---------------------------------------------
  # 1) OMNIBUS: por cada bloque de `comparisons`, ¿difiere algún nivel?
  #    (con 2 grupos, el omnibus ES la comparación directa).
  # 2) PARES (post-hoc): todas las parejas, con `correction` aplicada → p_corrected.
  #    Salen en estadistica/stats_comparisons.csv y como barras en las figuras.
  # 3) FACTORIAL (abajo): efectos principales E INTERACCIONES en un solo modelo,
  #    con su propio post-hoc de celdas.

  # POST-HOC de ≥3 grupos:
  #   "auto"  (default) pruebas por pares (t o Mann-Whitney según supuestos) con
  #           corrección múltiple `correction` → p_corrected.
  #   "tukey" Tukey HSD, el post-hoc clásico tras un ANOVA paramétrico (controla
  #           el error familiar por sí mismo; no aplica corrección extra).
  #           Solo para diseños NO pareados.
  posthoc: "auto"

  factorial:
    enabled: true             # análisis de N vías (p. ej. dieta × sexo).
    factores: ["dieta", "sexo", "condicion"]   # columnas a cruzar (mínimo 2).
                              # Con 3 factores obtienes los 3 efectos principales,
                              # las 3 interacciones dobles y la triple. Ojo: la
                              # interacción triple es la que menos potencia tiene;
                              # si el n por celda es bajo, considera dejar 2 factores.
    posthoc_celdas: true      # tras el factorial, comparar las CELDAS del cruce
                              # (control·hembra vs obeso·macho, …) → factorial/posthoc_celdas.csv
    posthoc_solo_si_interaccion: true   # hacerlo SOLO en las métricas cuya
                              # interacción salió significativa (recomendado: evita
                              # cientos de comparaciones sin sentido). false = todas.

    # FIGURAS DEL CRUCE: un panel por métrica con TODAS las celdas del cruce,
    # agrupadas jerárquicamente y con una familia de color por el factor externo
    # (p. ej. hembras en amarillos/rosas, machos en azules/morados).
    # → factorial/figuras_celdas/celdas_<metrica>.png
    figuras_celdas: true
    factores_figura: ["sexo", "dieta", "condicion"]   # de EXTERNO a INTERNO.
                              # El 1º define las familias de color y los bloques;
                              # el último son las cajas contiguas. Si lo dejas en
                              # null se usan los mismos `factores` del factorial.
    # Prueba: si `metodo` es paramétrico (o auto con residuos normales) → ANOVA de
    # N vías (statsmodels, typ=2). Si no → ART (Aligned Rank Transform), la versión
    # no paramétrica que SÍ permite probar interacciones (Wobbrock et al. 2011).
    # Salida: <analisis>/factorial/efectos_e_interacciones.csv

# -----------------------------------------------------------------------------
# GRUPOS — define el diseño experimental para las comparaciones.
# Lista los grupos que esperas; el pipeline avisa si el manifiesto trae otros.
# -----------------------------------------------------------------------------
groups:
  # OPCIONAL. Los grupos del análisis SIEMPRE se leen del manifiesto (columna
  # 'group'). Esta lista solo sirve para avisarte si aparece un grupo que no
  # esperabas. Déjala vacía [] para no comprobar nada.
  expected: []

# -----------------------------------------------------------------------------
# PLOTTING — apariencia de las figuras.
# -----------------------------------------------------------------------------
plotting:
  psd_scale: "loglog"     # loglog | semilog | both  (escala de las figuras de PSD)
  notch_hz: [57, 63]      # franja excluida en las figuras de PSD (ruido eléctrico
                          # de 60 Hz). En Europa usa [48, 52]. [] = no excluir nada.
  # Paleta de color por grupo. La CLAVE debe coincidir con el nombre del grupo en
  # el manifiesto. Lo que no esté aquí recibe un color automático (consistente).
  palette:
    control: "#0072B2"    # azul
    tratamiento: "#D55E00"  # naranja
    pups: "#D55E00"       # naranja (sinónimo de obeso)
    obeso: "#D55E00"      # naranja
    hembra: "#CC79A7"     # rosa
    macho: "#009E73"      # verde

# -----------------------------------------------------------------------------
# SEGMENTOS DE ANÁLISIS
# -----------------------------------------------------------------------------
# DESCRIPTIVO: una carpeta con TODOS los grupos juntos (PSD global, etc.).
descriptivo:
  enabled: true
  by: "dieta"             # columna del manifiesto que define los grupos.

# COMPARACIONES: cada bloque genera su propia carpeta con estadística de DOS
# grupos para TODAS las combinaciones por pares de los niveles de `by`.
#   by      : columna a comparar (group, sex, condition, …). Debe existir en el manifiesto.
#   within  : (opcional) estratifica: repite la comparación dentro de cada nivel
#             de esta columna (p. ej. comparar grupos por separado en hembras y machos).
#   enabled : activa/desactiva este bloque sin borrarlo.
comparisons:
  - name: "dieta"              # control vs obeso (todas las parejas de 'dieta')
    by: "dieta"
    within: null
    enabled: true
  - name: "dieta_por_sexo"     # control vs obeso, por separado en cada sexo
    by: "dieta"
    within: "sexo"
    enabled: true
  - name: "sexo"               # hembra vs macho
    by: "sexo"
    within: null
    enabled: true
  - name: "sexo_por_dieta"     # hembra vs macho, por separado en cada dieta
    by: "sexo"
    within: "dieta"
    enabled: true
  - name: "condicion"          # foto vs meso (efecto de la condición lumínica)
    by: "condicion"
    within: null
    enabled: true
  - name: "condicion_por_dieta"   # foto vs meso, por separado en cada dieta
    by: "condicion"
    within: "dieta"
    enabled: true
  - name: "condicion_por_sexo"    # foto vs meso, por separado en cada sexo
    by: "condicion"
    within: "sexo"
    enabled: true
  - name: "dieta_por_condicion"   # control vs obeso, por separado en foto y en meso
    by: "dieta"
    within: "condicion"
    enabled: true
  # NOTA: `by` y `within` son COLUMNAS del manifest.csv (las genera el modo scan
  # a partir de dataset.scan.factores). Si una columna no existe, ese bloque se
  # omite con un aviso, sin romper el pipeline.

# -----------------------------------------------------------------------------
# SALIDAS y verificación.
# -----------------------------------------------------------------------------
output:
  dir: "resultados"
  save_figures: true
  dpi: 150

checks:
  stop_on_error: true     # true = el pipeline se DETIENE ante un check rojo.
                          # false = sigue y lo registra en el reporte (modo exploratorio).
  max_rejected_epochs_frac: 0.30   # umbral ámbar de % de épocas rechazadas.
  min_specparam_r2: 0.90           # R² mínimo aceptable del ajuste 1/f.
  energy_conservation_tol: 0.05    # las bandas deben sumar ≈ potencia total (±5 %).
